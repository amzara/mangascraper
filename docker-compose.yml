services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports: ["8191:8191"]
    environment:
      LOG_LEVEL: info
      HEADLESS: "true"
    restart: unless-stopped

  scraper:
    build: ./api
    container_name: scraper
    depends_on: [flaresolverr]
    ports: ["8081:8081"]
    volumes:
      - /data/mangascraper:/root/downloads
    environment:
      PORT: 8081
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: test1ng
      DB_NAME: mangascraper
      FLARESOLVERR_URL: http://flaresolverr:8191
    extra_hosts: ["host.docker.internal:host-gateway"]

  images:
    image: nginx:alpine
    container_name: mangascraper-images
    ports: ["8080:80"]
    volumes:
      - /data/mangascraper:/data/mangascraper:ro
      - ./scripts/nginx-image-server.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  web:
    build:
      context: ./app
      args:
        API_HOST: ${API_HOST:-}
        IMAGE_HOST: ${IMAGE_HOST:-}
    container_name: mangascraper-web
    ports: ["8082:80"]
    depends_on: [scraper]
    restart: unless-stopped
