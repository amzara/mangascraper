server {
    listen 80;
    server_name _;
    root /data/mangascraper;

    location / {
        try_files $uri $uri/ =404;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
